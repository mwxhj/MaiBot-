# MaiBot 配置文件
# 所有敏感信息（如API密钥）应在生产环境中使用环境变量或安全存储

# 系统基本设置
system:
  name: "林静"
  version: "0.1.0"
  log_level: "DEBUG"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  timezone: "Asia/Shanghai"
  language: "zh-CN"
  data_dir: "data"
  plugins_dir: "plugins"
  templates_dir: "templates"
  assets_dir: "assets"
  logging:
    retention_days: 30  # 日志保留天数
  network:
    default_download_timeout: 30.0  # 默认文件下载超时(秒)

# 机器人核心设置
bot:
  # 基本配置
  name: "林静"
  version: "0.1.0"
  description: "基于多LLM的智能对话机器人"
  log_level: "DEBUG"
  
  # 事件总线配置
  event_bus:
    max_concurrent_events: 10  # 最大并发事件数
    error_handling: "log_and_continue"  # log_and_continue, strict
  
  # 会话设置
  session:
    timeout: 1800  # 会话超时时间（秒），默认30分钟
    message_context:
      include_personality: true  # 是否在消息上下文中包含人格信息
      include_history: true      # 是否在消息上下文中包含历史对话
      include_emotion: true      # 是否在消息上下文中包含情绪信息
      depth: 20                  # 对话上下文深度（轮次）
      auto_association: true     # 启用自动记忆关联
      max_cache_items: 1000      # 向量缓存最大条目
    
    default_system_prompt: "你是林静AI助手，一个友好、聪明且乐于助人的人工智能助手。你现在在QQ群聊中，请尽可能简洁地回答问题，避免过长回复。"
    max_response_length: 500  # 回复最大长度，避免在群里发送过长消息
  
  # 处理器执行顺序设置 - 确保与ProcessorName中定义的处理器匹配
  processor_pipeline: [
    "read_air",
    "thought_generator",
    "willingness_checker", # **新增：插入意愿检查器**
    "response_composer"
  ]

# LLM模型配置
llm:
  # 令牌计数器设置
  token_counter:
    default_model: "gpt-4o-mini"

  # 供应商列表
  providers:
    # OpenAI 供应商
    - id: "openai_main"
      type: "openai_compatible"
      name: "OpenAI Main"
      enabled: true
      api_key: "${OPENAI_API_KEY}"
      timeout: 60
      models:
        - "gpt-4o-mini"
        - "gpt-4o"
        - "text-embedding-3-small"
        - "text-embedding-3-large"

    # 自定义供应商示例
    - id: "DEEPDUCK_provider"
      type: "openai_compatible"
      name: "DEEPDUCK LLM"
      enabled: true
      api_key: "${DEEPDUCK_API_KEY}"
      api_base: "${DEEPDUCK_BASE_URL}"
      timeout: 60
      models:
        - "deepseek-v3-0324"
        - "text-embedding-3-small"
        - "deepseek-v3-0324"


    - id: "mingwang_provider"
      type: "openai_compatible"
      name: "MingWang LLM"
      enabled: true
      api_key: "${MINGWANG_API_KEY}"
      api_base: "${MINGWANG_BASE_URL}"
      timeout: 60
      models:
        - "gemini-2.5-pro-exp-03-25"


    - id: "DEEPSEEK_provider"
      type: "openai_compatible"
      name: "DEEPSEEK LLM"
      enabled: true
      api_key: "${DEEPSEEK_API_KEY}"
      api_base: "${DEEPSEEK_BASE_URL}"
      timeout: 60
      models:
        - "deepseek-chat"



  # 任务路由策略
  usage_strategy:
    # 任务到供应商和模型的路由映射
    task_routing:
      # chat 任务: 优先 OpenAI，失败则回退到 MingWang
      chat:
        - provider_id: "mingwang_provider"
          model: "gemini-2.5-pro-exp-03-25"
      # embeddings 任务: 优先 MingWang，失败则回退到 OpenAI
      embeddings:
        - provider_id: "DEEPDUCK_provider"
          model: "text-embedding-3-small"
      # 其他任务暂时保持单个提供商
      summarization:
        - provider_id: "DEEPSEEK_provider"
          model: "deepseek-chat"
      creative:
        - provider_id: "DEEPSEEK_provider"
          model: "deepseek-chat"
      read_air:
        - provider_id: "DEEPSEEK_provider"
          model: "deepseek-chat"
      thought_generation:
        - provider_id: "DEEPSEEK_provider"
          model: "deepseek-chat"
      # **新增：意愿检查任务路由**
      willingness_check:
        - provider_id: "DEEPSEEK_provider" # 或者选择其他合适的模型
          model: "deepseek-chat"

# 存储设置
storage:
  # 数据库设置
  database:
    type: "postgresql"  # <--- 修改数据库类型
    host: "1Panel-postgresql-wHk9"     # <--- 数据库容器的主机名/服务名 (示例，请根据实际情况修改)
    port: 5432           # <--- PostgreSQL 默认端口 (通常不需要修改)
    user: "mingwang" # <--- 您将创建的数据库用户名 (示例)
    password: "${DB_PASSWORD}" # <--- 数据库密码 (强烈建议使用环境变量)
    database: "linjing_db" # <--- 您将创建的数据库名称 (示例)
    # 连接配置 (PostgreSQL 特定)
    connection:
      timeout: 30          # 连接超时
      # isolation_level: null # PostgreSQL 默认通常足够
    # 初始化设置
    create_tables_on_connect: true # 保持启动时检查/创建表
    migrations_dir: "linjing/storage/migrations" # 迁移目录保持不变
    
  # 向量数据库设置
  vector_db:
    type: "qdrant"  # 修正为实际使用的数据库类型
    path: "data/vector_store"
    collection_name: "memories"
    dimension: 1536  # OpenAI嵌入向量维度
    similarity: "Cosine"  # 首字母大写，符合Qdrant API要求
    default_timeout: 10.0  # 默认操作超时(秒)
    default_batch_size: 100  # 默认批量大小
    default_cache_size: 1000  # 默认客户端缓存大小
    default_search_limit: 10  # 默认搜索结果数

# ======================== 更新后的配置部分 ========================

# 记忆系统设置 (更新)
memory:
  # 记忆存储设置 (Storage Settings)
  storage:
    type: "hybrid"  # 存储模式: "hybrid" (混合), "vector" (仅向量), "database" (仅数据库)
    max_conversation_history: 50  # 最大对话历史记录数 (用于短期记忆)
    memory_decay_rate: 0.95  # 记忆重要性随时间衰减的速率 (0-1, 1表示不衰减)
    importance_threshold: 0.5  # 形成长期记忆的重要性阈值 (0-1)
    max_memories_per_retrieval: 5  # 单次检索操作返回的最大记忆数量

  # 向量存储配置 (Vector Store Configuration)
  vector_store:
    type: "qdrant"  # 向量数据库类型: "qdrant", "chromadb", "faiss" 等
    path: "data/vector_store"  # 本地存储路径 (如果适用)
    collection_name: "memories"  # 向量集合/索引的名称
    dimension: 1536  # 向量维度 (需与使用的 Embedding 模型匹配, e.g., OpenAI text-embedding-ada-002 is 1536)
    similarity: "Cosine"  # 向量相似度计算方法: "Cosine", "Euclidean", "DotProduct"

  # 知识图谱配置 (Knowledge Graph Configuration)
  knowledge_graph:
    enabled: true  # 是否启用知识图谱功能
    max_relations: 1000  # 图谱中允许的最大关系数量
    relation_decay: 0.9  # 关系强度随时间衰减的速率 (0-1)
    min_relation_strength: 0.3  # 认为关系有效的最小强度阈值 (0-1)

  # 记忆检索配置 (Retrieval Configuration)
  retrieval:
    max_results: 5  # 最终返回给用户的最大检索结果数量
    similarity_threshold: 0.75  # 向量相似度阈值 (0-1, 仅返回高于此阈值的结果)
    # 记忆排序权重 (总和建议为 1.0)
    time_weight: 0.3  # 时间因素 (新近度) 的权重
    importance_weight: 0.5  # 记忆重要性评分的权重
    relevance_weight: 0.2  # 与查询的向量相似度 (相关性) 的权重

  # 嵌入管理器配置 (Embedding Manager Configuration)
  embedding:
    batch_size: 10  # 批量处理文本进行 Embedding 的数量
    max_retries: 3  # 调用 Embedding API 失败时的最大重试次数
    timeout: 30  # 调用 Embedding API 的超时时间 (秒)
    pending_processing_limit: 100  # 处理待处理嵌入默认限制

  # 关系数据库配置 (Relational Database Configuration)
  database:
    type: "sqlite"  # 数据库类型: "sqlite", "postgresql" 等
    path: "data/memories.db"  # SQLite 数据库文件路径
    max_connections: 10  # 数据库连接池的最大连接数 (如果适用)
    default_query_limit: 100  # 默认数据库查询限制

# 情感系统设置 (V12 适配版)
emotion:
  enabled: true
  update_interval: 60  # 背景情绪 (Mood) 衰减/更新间隔 (秒)
  max_history: 50     # 存储的情绪状态历史记录数 (用于调试或分析)

  # 定义机器人能够内部感受和在 current_mind_info 中使用的情绪词汇
  # 需要与 prompts.yaml 中 thought_generator 部分的 emotion 类型保持一致
  emotion_vocabulary:
    - 平静
    - 好奇
    - 愉悦
    - 烦躁
    - 愤怒
    - 轻蔑
    - 困惑
    - 警惕
    - 受伤
    # 可以根据 V12 原则和需要添加更多具体情绪

  # 背景情绪模型 (Mood Model) 参数 - 控制 mood_prompt 的动态变化
  mood_model:
    decay_rate: 0.05       # 背景情绪强度向基线衰减的速率 (每次更新间隔，0-1)
    baseline_mood: "平静" # 默认的、中性的背景情绪状态
    # 可以添加更多参数来控制情绪如何累积和衰减

  # 事件对背景情绪的影响因子 (Event Impact Factors) - 定义不同事件如何影响背景情绪
  # 具体逻辑在 MoodModel 中实现，这里提供参数
  event_impact:
    # 示例：正面/负面交互对背景情绪的基准影响值 (+/-)
    positive_interaction_base_impact: 0.1
    negative_interaction_base_impact: -0.2
    # 示例：V12 触发器对背景情绪的负面影响权重 (乘以基准负面影响)
    v12_trigger_impact_multiplier:
      disrespect: 1.5
      logical_fallacy: 0.5
      provocation: 1.2
      personal_attack: 2.5
      # ... 其他触发器 ...
    # 可以添加更多事件类型及其影响参数

  # 情绪表达控制参数 (Expression Control) - 主要供代码逻辑参考
  expression_control:
    # 定义 current_mind_info 中使用的情绪强度等级
    intensity_levels: ["low", "medium", "high", "extreme"]
    # 可选：如果内部需要数值映射，可以在这里定义阈值
    # intensity_thresholds:
    #   low: 0.2
    #   medium: 0.5
    #   high: 0.8

# 处理器配置
processors:
  read_air:
    group_max_history: 30  # 群组整体历史
    group_user_max_history: 10 # 群组内用户独立历史
  # 处理器配置
  read_air:
    enabled: true
    llm_max_tokens: 1000  # LLM分析最大Token数
    description: "理解用户输入和环境信息的处理器"
    confidence_threshold: 0.6
    max_history: 10
    analyze_intent: true
    extract_entities: true
  
  thought_generator:
    enabled: true
    description: "生成内部思考过程的处理器"
    max_tokens: 1000
    temperature: 0.7
    top_p: 0.9
    show_reasoning: true
  
  response_composer:
    enabled: true
    description: "生成最终回复的处理器"
    max_tokens: 1000
    temperature: 0.7
    max_length: 500
    format_response: true
    filter_sensitive: true
  
  # **新增：WillingnessChecker 配置**
  willingness_checker:
    enabled: true
    description: "判断是否适合表达内心想法的处理器"
    skip_on_mention: true # 被 @ 时跳过检查
    default_willingness: true # LLM 调用失败时的默认行为
    max_history_for_willingness: 3 # 用于判断意愿时参考的历史消息数量
    llm_max_tokens: 100  # LLM判断意愿最大Token数

# 适配器设置
adapters:
  # OneBot适配器设置 (用于QQ机器人)
  onebot:
    enabled: true
    is_reverse: true  # 使用反向WebSocket模式
    reverse_ws_host: "${ONEBOT_HOST:-0.0.0.0}"  # 强制使用IPv4
    reverse_ws_port: ${ONEBOT_PORT:-6700}  # OneBot标准端口
    family: AF_INET  # 指定IPv4协议
    access_token: "${ONEBOT_ACCESS_TOKEN}"  # OneBot访问令牌
    # **修改：配置 NapCat HTTP API 地址为正确的端口 3001**
    http_api_url: "http://napcat:3001/"
    heartbeat_interval: 5000  # 心跳间隔，单位毫秒
    rate_limit: 5.0   # 每秒API请求限制
    api_defaults:
      rate_limit: 5.0  # 默认API速率限制
      burst_limit: 10  # 默认API突发限制
    burst_limit: 10    # 突发请求限制
    
    # QQ机器人功能设置 (这些设置可能需要在具体实现中添加)
    qq:
      admin_qq: [123456, 789012]  # 管理员QQ号列表
      always_respond_at: true     # 是否总是响应@
      respond_to_prefix: true     # 是否响应前缀命令
      command_prefix: "/"         # 命令前缀
      keyword_trigger: true       # 是否启用关键词触发
      trigger_keywords: ["林静", "机器人"]  # 触发关键词

# 插件系统 - 目前代码中未实现，将此部分设为禁用状态
plugins:
  enabled: false
  auto_load: false
  plugins_dir: "plugins"
