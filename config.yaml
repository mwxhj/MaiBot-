# MaiBot 配置文件
# 所有敏感信息（如API密钥）应在生产环境中使用环境变量或安全存储

# 系统基本设置
system:
  name: "林镜"
  version: "0.1.0"
  log_level: "DEBUG"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  timezone: "Asia/Shanghai"
  language: "zh-CN"
  data_dir: "data"
  plugins_dir: "plugins"
  templates_dir: "templates"
  assets_dir: "assets"
  logging:
    retention_days: 30  # 日志保留天数
  network:
    default_download_timeout: 30.0  # 默认文件下载超时(秒)
  # 配置加载顺序
  configs:
    - "config.yaml"                  # 主配置文件
    - "linjing/config/prompts.yaml"  # 提示词配置
    - "linjing/config/concurrent.yaml" # 并发控制组件配置

# 调试配置
debug:
  always_high_alert: false  # 开发模式：始终处于高戒备状态，回复所有消息
  log_all_events: true     # 记录所有接收到的事件

# 并发控制组件配置
concurrent:
  # 队列管理器配置
  queue:
    max_queues: 15            # 最大并发队列数量
    max_queue_size: 50         # 每个队列的最大容量
    queue_timeout: 120       # 队列处理超时时间（秒）
    idle_cleanup_interval: 300.0 # 空闲队列清理间隔（秒）
  
  # 消息去重/合并器配置
  debounce:
    window: 1.5                # 合并窗口（秒）
    min_messages: 2            # 最小合并消息数
    max_messages: 5            # 最大合并消息数
    high_alert_only: true      # 只在高警戒模式下合并消息
    check_interval: 0.1        # 检查间隔（秒）
  
  # 资源锁配置
  lock:
    use_simplified: true       # 使用简化版资源锁管理器
    timeout: 5              # 锁获取超时时间（秒）

# 机器人核心设置
bot:
  # 基本配置
  name: "林镜"
  version: "0.1.0"
  description: "基于多LLM的智能对话机器人"
  log_level: "DEBUG"
  
  # 事件总线配置
  event_bus:
    max_concurrent_events: 10  # 最大并发事件数
    error_handling: "log_and_continue"  # log_and_continue, strict
  
  # 会话设置
  session:
    timeout: 1800  # 会话超时时间（秒），默认30分钟
    message_context:
      include_personality: true  # 是否在消息上下文中包含人格信息
      include_history: true      # 是否在消息上下文中包含历史对话
      include_emotion: true      # 是否在消息上下文中包含情绪信息
      depth: 20                  # 对话上下文深度（轮次）
      auto_association: true     # 启用自动记忆关联
      max_cache_items: 1000      # 向量缓存最大条目
    
    default_system_prompt: "我是林镜，一个有自己想法和情绪的 AI。我的回应会基于我的判断和当前的心情。不要期待我总是友好或乐于助人。" # V12 人设调整
    max_response_length: 500  # 回复最大长度，避免在群里发送过长消息
  
  # 处理器执行顺序设置 - 确保与ProcessorName中定义的处理器匹配
  processor_pipeline: [
    "read_air",
    "thought_generator",
    "willingness_checker", # **新增：插入意愿检查器**
    "response_composer"
  ]

  # V12 触发条件配置
  trigger_conditions:
    mention_trigger_enabled: true       # 是否启用 @mention 触发
    message_count_threshold: 10         # 消息计数阈值 (需要实现状态存储)
    message_count_trigger_enabled: true # 是否启用消息计数触发 (暂不实现)
    time_interval_threshold: 300        # 时间间隔阈值 (秒) (需要实现状态存储)
    time_interval_trigger_enabled: rue # 是否启用时间间隔触发
    high_alert_mode_trigger_enabled: true # 是否启用高戒备模式触发 (现在改为 true 以便测试)
    high_alert_duration: 5             # 高戒备持续消息数 (改为 5)
    # 新增：名字触发配置
    name_trigger_enabled: true          # 是否启用名字触发高戒备
    bot_names: ["林镜", "Linjing"]      # 触发高戒备的机器人名字列表

# LLM模型配置
llm:
  # 令牌计数器设置
  token_counter:
    default_model: "gpt-4o-mini"

  # 供应商列表
  providers:
    # OpenAI 供应商
    - id: "openai_main"
      type: "openai_compatible"
      name: "OpenAI Main"
      enabled: true
      api_key: "${OPENAI_API_KEY}"
      timeout: 60
      models:
        - "gpt-4o-mini"
        - "gpt-4o"
        - "text-embedding-3-small"
        - "text-embedding-3-large"

    # 自定义供应商示例
    - id: "DEEPDUCK_provider"
      type: "openai_compatible"
      name: "DEEPDUCK LLM"
      enabled: true
      api_key: "${DEEPDUCK_API_KEY}"
      api_base: "${DEEPDUCK_BASE_URL}"
      timeout: 60
      models:
        - "deepseek-v3-0324"
        - "text-embedding-3-small"
        - "deepseek-v3-0324"


    - id: "mingwang_provider"
      type: "openai_compatible"
      name: "MingWang LLM"
      enabled: true
      api_key: "${MINGWANG_API_KEY}"
      api_base: "${MINGWANG_BASE_URL}"
      timeout: 60
      models:
        - "gemini-2.5-pro-exp-03-25"


    - id: "DEEPSEEK_provider"
      type: "openai_compatible"
      name: "DEEPSEEK LLM"
      enabled: true
      api_key: "${DEEPSEEK_API_KEY}"
      api_base: "${DEEPSEEK_BASE_URL}"
      timeout: 60
      models:
        - "deepseek-chat"



    - id: "DUCKgemini_provider"
      type: "openai_compatible"
      name: "DUCKgemini LLM"
      enabled: true
      api_key: "${DUCKgemini_API_KEY}"
      api_base: "${DUCKgemini_BASE_URL}"
      timeout: 60
      models:
        - "gemini-1.5-pro-latest"



  # 任务路由策略
  usage_strategy:
    # 任务到供应商和模型的路由映射
    task_routing:
      # chat 任务: 优先 OpenAI，失败则回退到 MingWang
      chat:
        - provider_id: "mingwang_provider"
          model: "gemini-2.5-pro-exp-03-25"
      # embeddings 任务: 优先 MingWang，失败则回退到 OpenAI
      embeddings:
        - provider_id: "DEEPDUCK_provider"
          model: "text-embedding-3-small"
      # 其他任务暂时保持单个提供商
      summarization:
        - provider_id: "DUCKgemini_provider"
          model: "gemini-1.5-pro-latest"
      creative:
        - provider_id: "DUCKgemini_provider"
          model: "gemini-1.5-pro-latest"
      read_air:
        - provider_id: "DUCKgemini_provider"
          model: "gemini-1.5-pro-latest"
      thought_generator:
        - provider_id: "DUCKgemini_provider"
          model: "gemini-1.5-pro-latest"
      # **修改：使用正确的处理器名称**
      willingness_checker:
        - provider_id: "DUCKgemini_provider" # 或者选择其他合适的模型
          model: "gemini-1.5-pro-latest"
      # **添加：添加response_composer处理器**
      response_composer:
        - provider_id: "mingwang_provider"
          model: "gemini-2.5-pro-exp-03-25"

# 存储设置
storage:
  # 数据库设置
  database:
    type: "postgresql"  # <--- 修改数据库类型
    host: "postgres_db"     # <--- 修改为 Docker Compose 中的服务名
    port: 5432           # <--- PostgreSQL 默认端口 (通常不需要修改)
    user: "mingwang" # <--- 您将创建的数据库用户名 (示例)
    password: "${DB_PASSWORD}" # <--- 数据库密码 (强烈建议使用环境变量)
    database: "linjing_db" # <--- 您将创建的数据库名称 (示例)
    # 连接配置 (PostgreSQL 特定)
    connection:
      timeout: 30          # 连接超时
      # isolation_level: null # PostgreSQL 默认通常足够
    # 初始化设置
    create_tables_on_connect: true # 保持启动时检查/创建表
    migrations_dir: "linjing/storage/migrations" # 迁移目录保持不变
    
  # 向量数据库设置
  vector_db:
    type: "qdrant"  # 修正为实际使用的数据库类型
    path: "data/vector_store"
    collection_name: "memories"
    dimension: 1536  # OpenAI嵌入向量维度
    similarity: "Cosine"  # 首字母大写，符合Qdrant API要求
    default_timeout: 10.0  # 默认操作超时(秒)
    default_batch_size: 100  # 默认批量大小
    default_cache_size: 1000  # 默认客户端缓存大小
    default_search_limit: 10  # 默认搜索结果数

# ======================== 更新后的配置部分 ========================

# 记忆系统设置 (更新)
memory:
  # 记忆存储设置 (Storage Settings)
  storage:
    type: "hybrid"  # 存储模式: "hybrid" (混合), "vector" (仅向量), "database" (仅数据库)
    max_conversation_history: 50  # 最大对话历史记录数 (用于短期记忆)
    memory_decay_rate: 0.95  # 记忆重要性随时间衰减的速率 (0-1, 1表示不衰减)
    importance_threshold: 0.5  # 形成长期记忆的重要性阈值 (0-1)
    max_memories_per_retrieval: 5  # 单次检索操作返回的最大记忆数量

  # 向量存储配置 (Vector Store Configuration)
  vector_store:
    type: "qdrant"  # 向量数据库类型: "qdrant", "chromadb", "faiss" 等
    path: "data/vector_store"  # 本地存储路径 (如果适用)
    collection_name: "memories"  # 向量集合/索引的名称
    dimension: 1536  # 向量维度 (需与使用的 Embedding 模型匹配, e.g., OpenAI text-embedding-ada-002 is 1536)
    similarity: "Cosine"  # 向量相似度计算方法: "Cosine", "Euclidean", "DotProduct"

  # 知识图谱配置 (Knowledge Graph Configuration)
  knowledge_graph:
    enabled: true  # 是否启用知识图谱功能
    max_relations: 1000  # 图谱中允许的最大关系数量
    relation_decay: 0.9  # 关系强度随时间衰减的速率 (0-1)
    min_relation_strength: 0.3  # 认为关系有效的最小强度阈值 (0-1)

  # 记忆检索配置 (Retrieval Configuration)
  retrieval:
    max_results: 5  # 最终返回给用户的最大检索结果数量
    similarity_threshold: 0.75  # 向量相似度阈值 (0-1, 仅返回高于此阈值的结果)
    # 记忆排序权重 (总和建议为 1.0)
    time_weight: 0.3  # 时间因素 (新近度) 的权重
    importance_weight: 0.5  # 记忆重要性评分的权重
    relevance_weight: 0.2  # 与查询的向量相似度 (相关性) 的权重

  # 嵌入管理器配置 (Embedding Manager Configuration)
  embedding:
    batch_size: 10  # 批量处理文本进行 Embedding 的数量
    max_retries: 3  # 调用 Embedding API 失败时的最大重试次数
    timeout: 30  # 调用 Embedding API 的超时时间 (秒)
    pending_processing_limit: 100  # 处理待处理嵌入默认限制

  # 关系数据库配置 (Relational Database Configuration)
  database:
    type: "sqlite"  # 数据库类型: "sqlite", "postgresql" 等
    path: "data/memories.db"  # SQLite 数据库文件路径
    max_connections: 10  # 数据库连接池的最大连接数 (如果适用)
    default_query_limit: 100  # 默认数据库查询限制

# 情感系统设置 (V12 适配版 - 配置化)
emotion:
  enabled: true
  update_interval: 60  # 背景情绪 (Mood) 衰减/更新间隔 (秒)
  max_history: 50     # 存储的情绪状态历史记录数 (用于调试或分析)

  # VAD 模型配置
  vad_model:
    baseline_vad: [0.5, 0.3, 0.5] # 基线 VAD 值 [Valence, Arousal, Dominance] (趋向平静、略微顺从)
    decay_rate: 0.05             # VAD 值向基线衰减的速率 (每次更新间隔，0-1)
    significant_threshold: 0.3   # 判断情绪是否显著以便在 Prompt 中提及的阈值 (针对 VAD 值与基线的偏差)

  # MoodModel 参数 (用于计算基础变化，如果启用)
  mood_model:
    base_change_rate: 0.05 # 基础变化率 (MoodModel 使用)
    inertia_factor: 0.3    # 情绪惯性因子 (MoodModel 使用)
    # 维度相关性 (示例，可根据需要扩展)
    dimension_correlations:
      valence:
        arousal: 0.2 # 愉悦度增加可能轻微增加激动度
      arousal:
        valence: 0.1 # 激动度增加可能轻微增加愉悦度

  # V12 触发器对 VAD 的影响效果
  # 定义每个触发器被激活时，对 VAD 三个维度的直接加/减值
  v12_trigger_effects:
    triggers_linjing_disrespect_sensitivity:    {"valence": -0.3, "arousal": 0.2, "dominance": -0.1}
    triggers_linjing_logical_fallacy_sensitivity: {"valence": -0.1, "arousal": 0.1, "dominance": 0.2}
    triggers_linjing_provocation_sensitivity:   {"valence": -0.4, "arousal": 0.4, "dominance": 0.0}
    triggers_linjing_personal_attack_sensitivity: {"valence": -0.5, "arousal": 0.3, "dominance": -0.2}
    triggers_linjing_misinformation_sensitivity: {"valence": -0.1, "arousal": 0.1, "dominance": 0.1}
    triggers_linjing_fairness_sensitivity:      {"valence": -0.2, "arousal": 0.2, "dominance": -0.1}
    triggers_linjing_ai_identity_sensitivity:   {"valence": 0.1, "arousal": -0.1, "dominance": 0.1}

  # 情绪平衡规则配置 (用于 EmotionRules 中的 ThresholdRule)
  balance_rules:
    valence_high: {threshold: 0.9, change: -0.05} # 愉悦度过高时降低
    valence_low:  {threshold: 0.1, change: 0.05}  # 愉悦度过低时提升
    arousal_high: {threshold: 0.9, change: -0.05} # 激动度过高时降低
    arousal_low:  {threshold: 0.1, change: 0.05}  # 激动度过低时提升
    # dominance 规则可以类似添加

  # 情绪描述配置 (用于 EmotionManager.mood_to_text)
  mood_description:
    # 定义 VAD 值到描述词的映射阈值
    valence_map:
      - {threshold: 0.8, word: "极其愉悦"}
      - {threshold: 0.65, word: "非常愉悦"}
      - {threshold: 0.55, word: "有点愉悦"}
      - {threshold: 0.45, word: "平静"} # 中性区间
      - {threshold: 0.35, word: "有点不悦"}
      - {threshold: 0.2, word: "非常不悦"}
      - {threshold: 0.0, word: "极其不悦"} # 低于 0.2
    arousal_map:
      - {threshold: 0.8, word: "极其激动"}
      - {threshold: 0.65, word: "非常激动"}
      - {threshold: 0.55, word: "有点激动"}
      - {threshold: 0.45, word: "平静"} # 中性区间
      - {threshold: 0.35, word: "有点冷静"}
      - {threshold: 0.2, word: "非常冷静"}
      - {threshold: 0.0, word: "极其冷静"}
    dominance_map:
      - {threshold: 0.8, word: "极其主导"}
      - {threshold: 0.65, word: "非常主导"}
      - {threshold: 0.55, word: "有点主导"}
      - {threshold: 0.45, word: "中立"} # 中性区间
      - {threshold: 0.35, word: "有点顺从"}
      - {threshold: 0.2, word: "非常顺从"}
      - {threshold: 0.0, word: "极其顺从"}

# 处理器配置
processors:
  read_air:
    group_max_history: 30  # 群组整体历史
    group_user_max_history: 10 # 群组内用户独立历史
  # 处理器配置
  read_air:
    enabled: true
    llm_max_tokens: 4096  # LLM分析最大Token数
    description: "理解用户输入和环境信息的处理器"
    confidence_threshold: 0.6
    max_history: 10
    analyze_intent: true
    extract_entities: true
  
  thought_generator:
    enabled: true
    description: "生成内部思考过程的处理器"
    max_tokens: 4096
    temperature: 0.7
    top_p: 0.9
    show_reasoning: true
    # prompts 配置将从 prompts.yaml 加载，此处移除

  response_composer:
    enabled: true
    description: "生成最终回复的处理器"
    max_tokens: 4096
    temperature: 0.7
    max_length: 500
    format_response: true
    filter_sensitive: true
  
  # **更新：WillingnessChecker 配置**
  willingness_checker:
    enabled: true
    description: "判断是否适合表达内心想法的处理器"
    skip_on_mention: false # 修改为 false，确保任何情况下都检查意愿
    default_willingness: true # LLM 调用失败时的默认行为
    max_history_for_willingness: 5 # 用于判断意愿时参考的历史消息数量
    llm_max_tokens: 4096  # LLM判断意愿最大Token数

# 适配器设置
adapters:
  # OneBot适配器设置 (用于QQ机器人)
  onebot:
    enabled: true
    is_reverse: true  # 使用反向WebSocket模式
    reverse_ws_host: "${ONEBOT_HOST:-0.0.0.0}"  # 强制使用IPv4
    reverse_ws_port: ${ONEBOT_PORT:-6700}  # OneBot标准端口
    family: AF_INET  # 指定IPv4协议
    access_token: "${ONEBOT_ACCESS_TOKEN}"  # OneBot访问令牌
    # **修改：配置 NapCat HTTP API 地址为正确的端口 3001**
    http_api_url: "http://napcat:3001/"
    heartbeat_interval: 5000  # 心跳间隔，单位毫秒
    rate_limit: 5.0   # 每秒API请求限制
    api_defaults:
      rate_limit: 5.0  # 默认API速率限制
      burst_limit: 10  # 默认API突发限制
    burst_limit: 10    # 突发请求限制
    expected_self_id: "2458449279"  # 预期机器人QQ号
    verify_self_id: true
    
    # QQ机器人功能设置 (这些设置可能需要在具体实现中添加)
    qq:
      admin_qq: [123456, 789012]  # 管理员QQ号列表
      always_respond_at: false    # V12 人设调整：不总是响应@
      respond_to_prefix: false    # V12 人设调整：不响应前缀命令
      command_prefix: "/"         # 命令前缀 (保留，但实际响应逻辑可能不依赖)
      keyword_trigger: false      # V12 人设调整：不启用关键词触发
      # trigger_keywords: ["林镜", "机器人"]  # V12 人设调整：注释掉关键词

# 插件系统 - 目前代码中未实现，将此部分设为禁用状态
plugins:
  enabled: false
  auto_load: false
  plugins_dir: "plugins"
