version: '3.8'

services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    restart: unless-stopped
    networks:
      - linjing-net
    ports:
      - "3100:3000"
      - "3101:3001"
      - "6099:6099"
    environment:
      - NAPCAT_UID=${NAPCAT_UID:-1000}
      - NAPCAT_GID=${NAPCAT_GID:-1000}
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - /app/qq:/app/.config/QQ
      - /app/napcat/config:/app/napcat/config 
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3

  linjing:
    build: 
      context: .
      dockerfile: Dockerfile
    image: linjing-bot:latest
    restart: unless-stopped
    depends_on:
      napcat:
        condition: service_healthy
      postgres_db: # <--- 重新添加对数据库服务的依赖
        condition: service_started # 或者 service_healthy 如果镜像支持
    networks:
      - linjing-net
    env_file:
      - ./.env
    environment:
      - ONEBOT_PORT=6099
      - ONEBOT_PROTOCOL=v11
      - ONEBOT_ACCESS_TOKEN=linjing-napcat-token-123456
      - ONEBOT_REVERSE=true
    volumes:
      - /app/linjing/MaiBot-:/app:rw
      - linjing-data:/app/data:rw
      - linjing-logs:/app/logs:rw
    ports:
      - "8000:8000"

  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - linjing-net
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__CLUSTER__ENABLED=false

  postgres_db: # <--- 重新添加 PostgreSQL 服务
    image: postgres:15 # 或者你需要的版本
    container_name: postgres_db_linjing # 避免与外部可能存在的 postgres_db 冲突
    restart: unless-stopped
    networks:
      - linjing-net
    environment:
      POSTGRES_USER: ${DB_USER:-mingwang} # 从 .env 读取或使用默认值
      POSTGRES_PASSWORD: ${DB_PASSWORD} # 从 .env 读取
      POSTGRES_DB: ${DB_NAME:-linjing_db} # 从 .env 读取或使用默认值
    volumes:
      - postgres-data:/var/lib/postgresql/data # 数据持久化
    # 可以取消注释下面的端口映射，如果需要从宿主机直接访问数据库
    # ports:
    #   - "5432:5432"

networks:
  linjing-net:
    driver: bridge
    attachable: true
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  linjing-data:
  linjing-logs:
  qdrant-data:
  postgres-data: # <--- 重新添加 PostgreSQL 数据卷
