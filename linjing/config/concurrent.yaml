# 并发控制组件配置

# 队列管理器配置
queue:
  max_queues: 100            # 最大并发队列数量
  max_queue_size: 50         # 每个队列的最大容量
  queue_timeout: 600.0       # 队列处理超时时间（秒）
  idle_cleanup_interval: 300.0 # 空闲队列清理间隔（秒）

# 消息去重/合并器配置
debounce:
  window: 3                # 合并窗口（秒）
  min_messages: 2            # 最小合并消息数
  max_messages: 5            # 最大合并消息数
  high_alert_only: true      # 只在高警戒模式下合并消息
  check_interval: 0.1        # 检查间隔（秒）

# 资源锁配置
lock:
  use_simplified: true       # 使用简化版资源锁管理器
  timeout: 30.0              # 锁获取超时时间（秒） 